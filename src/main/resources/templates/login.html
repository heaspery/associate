<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Member login')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-5">

  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-7 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 fw-bold mb-1">Member login</h1>
          <p class="text-body-secondary mb-4">Log in to manage the association's events.</p>
          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label" for="username">Username</label>
              <input class="form-control" type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="mb-4">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" name="password"
                     autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Log in</button>
          </form>
        </div>
      </div>
    </div>
  </div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
