<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${id} == null ? 'New event' : 'Edit event')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: admin-nav}"></nav>
<main>
  <h1 th:text="${id} == null ? 'New event' : 'Edit event'">Event form</h1>
  <form th:action="${id} == null ? @{/admin/events} : @{/admin/events/{id}(id=${id})}" method="post">
    <p>
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required>
    </p>
    <p>
      <label for="date">Date and time</label>
      <input type="datetime-local" id="date" name="date" required>
    </p>
    <p>
      <label for="location">Location</label>
      <input type="text" id="location" name="location">
    </p>
    <p>
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="6"></textarea>
    </p>
    <button type="submit">Save</button>
    <a th:href="@{/admin/events}">Cancel</a>
  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
