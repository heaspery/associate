<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${id} == null ? 'New event' : 'Edit event')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: admin-nav}"></nav>
<main class="container py-4">

  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="h3 fw-bold mb-4" th:text="${id} == null ? 'New event' : 'Edit event'">Event form</h1>
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form th:action="${id} == null ? @{/admin/events} : @{/admin/events/{id}(id=${id})}" method="post">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label" for="title">Title</label>
                <input class="form-control" type="text" id="title" name="title" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="date">Date and time</label>
                <input class="form-control" type="datetime-local" id="date" name="date" required>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="location">Location</label>
                <input class="form-control" type="text" id="location" name="location">
              </div>
              <div class="col-12">
                <label class="form-label" for="description">Description</label>
                <textarea class="form-control" id="description" name="description" rows="6"></textarea>
              </div>
              <div class="col-12 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/events}">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
