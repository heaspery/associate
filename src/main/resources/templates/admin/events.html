<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage events')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: admin-nav}"></nav>
<main class="container py-4">

  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <h1 class="h3 fw-bold mb-0">Manage events</h1>
    <a class="btn btn-primary" th:href="@{/admin/events/new}">Create an event</a>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col">Title</th>
            <th scope="col">Date</th>
            <th scope="col" class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Example event</td>
            <td class="text-body-secondary">Event date</td>
            <td class="text-end">
              <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin/events/{id}/edit(id=1)}">Edit</a>
              <form class="d-inline" th:action="@{/admin/events/{id}/delete(id=1)}" method="post">
                <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
