<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
  <h1 th:text="${status == 404} ? 'Page not found' : 'Something went wrong'">Error</h1>
  <p th:text="${status == 404} ? 'This page does not exist.' : 'Please try again later.'">Error message</p>
  <a th:href="@{/}">Back to the home page</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
