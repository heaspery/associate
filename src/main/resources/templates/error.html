<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-5 text-center">
  <p class="display-1 fw-bold text-primary mb-0" th:text="${status}">404</p>
  <h1 class="h2 fw-bold" th:text="${status == 404} ? 'Page not found' : 'Something went wrong'">Error</h1>
  <p class="lead text-body-secondary mb-4"
     th:text="${status == 404} ? 'The page you are looking for does not exist or has moved.' : 'Please try again in a few minutes.'">
    Error message</p>
  <a class="btn btn-primary" th:href="@{/}">Back to the home page</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
